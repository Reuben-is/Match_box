<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match_box Studio — Handmade Silver Jewellery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Instrument+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0f0e;--ink2:#1a1d1c;--silver:#c8cdd0;
  --cream:#f0ece4;--muted:#7a8a88;
  --garnet:#6b1a1a;--garnet-light:#8b2a2a;
}
body{background:var(--ink);color:var(--cream);font-family:'Instrument Sans',sans-serif;}

/* UPDATED PROCESS NUMBERS */
.step-num{font-family:'Playfair Display',serif;font-size:56px;font-weight:400;font-style:italic;color:var(--garnet-light);opacity:0.4;line-height:1;margin-bottom:20px;}

/* UPDATED HOVER EFFECT */
.cell-label{position:absolute;bottom:0;left:0;right:0;padding:24px 20px 20px;background:linear-gradient(to top,rgba(13,15,14,0.85),transparent);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,236,228,0.7);opacity:0;transform:translateY(10px);transition:all 0.3s ease;}
.g-cell:hover .cell-label{opacity:1;transform:translateY(0);}
</style>
</head>
