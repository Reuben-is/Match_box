<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Instrument Sans',sans-serif;font-weight:300;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:24px 48px;}
.nav-bg{position:absolute;inset:0;pointer-events:none;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;letter-spacing:0.06em;position:relative;z-index:1;}
.logo em{font-style:italic;}
.nav-links{display:flex;gap:32px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;position:relative;z-index:1;}
.nav-links a{text-decoration:none;transition:color 0.2s;}
.nav-cta{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 24px;cursor:pointer;transition:all 0.25s;position:relative;z-index:1;font-family:'Instrument Sans',sans-serif;text-decoration:none;display:inline-block;}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;}
.hero-left{display:flex;flex-direction:column;justify-content:flex-end;padding:120px 64px 80px;position:relative;}
.hero-bg-text{position:absolute;top:50%;left:48px;transform:translateY(-50%);font-family:'Playfair Display',serif;font-size:180px;font-weight:500;color:rgba(255,255,255,0.03);line-height:1;pointer-events:none;white-space:nowrap;font-style:italic;}
.hero-eyebrow{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.6;margin-bottom:28px;}
.hero-title{font-family:'Playfair Display',serif;font-size:72px;font-weight:400;line-height:1.0;margin-bottom:32px;}
.hero-title em{font-style:italic;}
.hero-body{font-size:14px;line-height:1.85;max-width:340px;margin-bottom:48px;}
.hero-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.btn-primary{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:14px 36px;cursor:pointer;border:none;font-family:'Instrument Sans',sans-serif;font-weight:400;transition:background 0.2s;text-decoration:none;display:inline-block;}
.btn-ghost{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;border:none;background:none;font-family:'Instrument Sans',sans-serif;transition:color 0.2s;text-decoration:none;}
.hero-right{position:relative;overflow:hidden;}
.hero-img-mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;}
.mosaic-cell{overflow:hidden;}
.mosaic-cell img{width:100%;height:100%;object-fit:cover;filter:saturate(0.7) contrast(1.1);transition:transform 0.6s ease;}
.mosaic-cell:hover img{transform:scale(1.04);}
.hero-right-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,15,14,0.4) 0%,transparent 60%);pointer-events:none;}

/* DIVIDER */
.divider-strip{border-top:0.5px solid rgba(200,205,208,0.1);border-bottom:0.5px solid rgba(200,205,208,0.1);padding:16px 0;overflow:hidden;}
.divider-inner{display:flex;gap:56px;white-space:nowrap;animation:marquee 28s linear infinite;}
.divider-item{font-size:10px;letter-spacing:0.24em;text-transform:uppercase;flex-shrink:0;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ABOUT */
.about{display:grid;grid-template-columns:1fr 1fr;min-height:80vh;}
.about-img{position:relative;overflow:hidden;}
.about-img img{width:100%;height:100%;object-fit:cover;filter:saturate(0.65) contrast(1.15);}
.about-img-overlay{position:absolute;inset:0;pointer-events:none;}
.about-content{padding:100px 72px;display:flex;flex-direction:column;justify-content:center;}
.section-label{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.5;margin-bottom:32px;display:flex;align-items:center;gap:16px;}
.section-label::after{content:'';display:block;width:40px;height:0.5px;background:rgba(200,205,208,0.3);}
.about-title{font-family:'Playfair Display',serif;font-size:44px;font-weight:400;line-height:1.15;margin-bottom:28px;}
.about-title em{font-style:italic;}
.about-body{font-size:14px;line-height:1.9;margin-bottom:40px;}
.about-body p+p{margin-top:16px;}

/* GALLERY / CAROUSEL */
.work{padding:100px 0 100px;}
.work-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:56px;padding:0 64px;border-bottom:0.5px solid rgba(200,205,208,0.08);padding-bottom:24px;}
.work-title{font-family:'Playfair Display',serif;font-size:40px;font-weight:400;}
.work-sub{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;}

.carousel-wrap{position:relative;}
.carousel-track-outer{overflow:hidden;padding:0 64px;cursor:grab;}
.carousel-track-outer:active{cursor:grabbing;}
.carousel-track{display:flex;gap:16px;transition:transform 0.5s cubic-bezier(0.25,0.1,0.25,1);will-change:transform;}

.carousel-slide{
  flex:0 0 auto;
  display:flex;flex-direction:column;
  user-select:none;
}
.slide-img-wrap{
  position:relative;overflow:hidden;
  aspect-ratio:3/4;   /* portrait — flattering for jewellery shots */
  margin-bottom:0;
}
.slide-img-wrap img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(0.75) contrast(1.08);
  transition:transform 0.6s ease, filter 0.4s ease;
  pointer-events:none;display:block;
}
.carousel-slide:hover .slide-img-wrap img{
  transform:scale(1.04);
  filter:saturate(0.95) contrast(1.08);
}

/* overlay shimmer on hover */
.slide-img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,0.6) 0%,transparent 50%);
  opacity:0;transition:opacity 0.4s;pointer-events:none;
}
.carousel-slide:hover .slide-img-wrap::after{opacity:1;}

.slide-info{padding:16px 4px 0;}
.slide-label{font-family:'Playfair Display',serif;font-size:16px;font-weight:400;margin-bottom:4px;}
.slide-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;}

/* ARROWS */
.carousel-controls{display:flex;align-items:center;justify-content:space-between;padding:40px 64px 0;}
.carousel-dots{display:flex;gap:8px;align-items:center;}
.dot{
  width:24px;height:2px;border:none;cursor:pointer;
  transition:all 0.3s;padding:0;
}
.dot.active{width:40px;}
.carousel-arrows{display:flex;gap:12px;}
.arrow{
  width:44px;height:44px;border:0.5px solid;
  background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;font-size:16px;
  font-family:'Instrument Sans',sans-serif;
}
.arrow:disabled{opacity:0.2;cursor:default;}

/* PROCESS */
.process{padding:120px 48px;border-top:0.5px solid rgba(200,205,208,0.08);}
.process-inner{max-width:900px;margin:0 auto;}
.process-title{font-family:'Playfair Display',serif;font-size:48px;font-weight:400;line-height:1.1;margin-bottom:16px;text-align:center;}
.process-title em{font-style:italic;}
.process-sub{text-align:center;font-size:14px;line-height:1.8;max-width:520px;margin:0 auto 80px;}
.process-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.step{padding:40px 28px;background:rgba(255,255,255,0.02);border:0.5px solid rgba(200,205,208,0.07);}
.step-num{font-family:'Playfair Display',serif;font-size:52px;font-weight:400;font-style:italic;line-height:1;margin-bottom:20px;}
.step-title{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:12px;}
.step-body{font-size:13px;line-height:1.8;}

/* CTA */
.commission{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:120px 48px;position:relative;overflow:hidden;border-top:0.5px solid rgba(200,205,208,0.08);}
.commission-bg{position:absolute;inset:0;pointer-events:none;}
.commission-label{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.5;margin-bottom:32px;}
.commission-title{font-family:'Playfair Display',serif;font-size:60px;font-weight:400;line-height:1.05;margin-bottom:24px;}
.commission-title em{font-style:italic;}
.commission-body{font-size:15px;line-height:1.9;max-width:480px;margin:0 auto 48px;}
.btn-commission{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;padding:18px 52px;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all 0.3s;display:inline-block;text-decoration:none;}
.commission-note{margin-top:24px;font-size:12px;letter-spacing:0.08em;}

/* FOOTER */
footer{border-top:0.5px solid rgba(200,205,208,0.08);padding:48px;display:flex;align-items:center;justify-content:space-between;}
.footer-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;}
.footer-logo em{font-style:italic;}
.footer-links{display:flex;gap:32px;}
.footer-links a{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:color 0.2s;}
.footer-copy{font-size:11px;letter-spacing:0.08em;}

@media(max-width:768px){
  nav{padding:20px 24px;} .nav-links{display:none;}
  .hero{grid-template-columns:1fr;} .hero-left{padding:100px 24px 48px;} .hero-title{font-size:48px;} .hero-right{height:50vh;}
  .about{grid-template-columns:1fr;} .about-img{height:50vh;} .about-content{padding:60px 24px;}
  .work-header{padding:0 24px 24px;} .carousel-track-outer{padding:0 24px;} .carousel-controls{padding:32px 24px 0;}
  .process{padding:60px 24px;} .process-steps{grid-template-columns:1fr 1fr;}
  .commission{padding:80px 24px;} .commission-title{font-size:40px;}
  footer{flex-direction:column;gap:24px;text-align:center;padding:40px 24px;}
}
</style>
</head>

    <div class="section-label" id="process-label" style="justify-content:center;margin-bottom:20px;"></div>

function res(src) { return IMAGES[src] || src; }

(function render() {
  const S = SETTINGS, C = S.colors;

  // NAV
  document.getElementById("nav").innerHTML = `
    <div class="nav-bg" style="position:absolute;inset:0;background:linear-gradient(to bottom,${C.background}f5,transparent);pointer-events:none;"></div>
    <div class="logo" style="color:${C.cream}">${S.brandName} <em style="color:${C.silver}">${S.brandSub}</em></div>
    <div class="nav-links">
      <a href="#work" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Work</a>
      <a href="#process" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Process</a>
      <a href="#about" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">About</a>
    </div>
    <a href="${S.instagramUrl}" target="_blank" class="nav-cta"
       style="background:${C.accent}22;border:0.5px solid ${C.accent}99;color:${C.cream}"
       onmouseover="this.style.background='${C.accent}'" onmouseout="this.style.background='${C.accent}22'">Commission a piece</a>`;

  // HERO
  const hl = document.getElementById("hero-left");
  hl.style.background = C.background;
  hl.innerHTML += `
    <p class="hero-eyebrow" style="color:${C.silver}">${S.hero.eyebrow}</p>
    <h1 class="hero-title" style="color:${C.cream}">${S.hero.title1}<br>${S.hero.title2} <em style="color:${C.silver}">${S.hero.titleEm}</em><br>${S.hero.title3}</h1>
    <p class="hero-body" style="color:${C.muted}">${S.hero.body}</p>
    <div class="hero-actions">
      <a href="${S.instagramUrl}" target="_blank" class="btn-primary"
         style="background:${C.accent};color:${C.cream}"
         onmouseover="this.style.background='${C.accentHover}'" onmouseout="this.style.background='${C.accent}'">${S.hero.ctaBtn}</a>
      <a href="#work" class="btn-ghost" style="color:${C.muted}"
         onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">${S.hero.ghostBtn}</a>
    </div>`;
  document.getElementById("hero-right").style.background = C.backgroundAlt;
  document.getElementById("hero-mosaic").innerHTML = ["HERO1","HERO2","HERO3","HERO4"].map(k =>
    `<div class="mosaic-cell"><img src="${res(k)}" alt=""></div>`).join("");

  // DIVIDER
  const di = ["Sterling silver","·","Commission only","·","Handmade one at a time","·",S.location,"·","Natural gemstones","·","Close collaboration","·"];
  document.getElementById("divider").innerHTML = [...di,...di].map(t =>
    `<span class="divider-item" style="color:${C.muted}">${t}</span>`).join("");
  document.querySelector(".divider-strip").style.background = C.backgroundAlt;

  // ABOUT
  const aiw = document.getElementById("about-img-wrap");
  aiw.style.background = C.backgroundAlt;
  const aimg = document.createElement("img");
  aimg.src = res("ABOUT"); aimg.alt = "Reuben";
  aimg.style.cssText = "width:100%;height:100%;object-fit:cover;filter:saturate(0.65) contrast(1.15);";
  aiw.insertBefore(aimg, aiw.firstChild);
  document.getElementById("about-overlay").style.background = `linear-gradient(to right,transparent 60%,${C.background})`;
  const ac = document.getElementById("about-content");
  ac.style.background = C.background;
  ac.innerHTML = `
    <div class="section-label" style="color:${C.silver}">${S.about.label}</div>
    <h2 class="about-title" style="color:${C.cream}">${S.about.title1}<br><em style="color:${C.silver}">${S.about.titleEm}</em></h2>
    <div class="about-body" style="color:${C.muted}">
      <p>${S.about.para1}</p><p>${S.about.para2}</p><p>${S.about.para3}</p>
    </div>`;

  // WORK HEADER
  document.getElementById("work").style.background = C.background;
  document.getElementById("work-header").innerHTML = `
    <h2 class="work-title" style="color:${C.cream}">${S.gallery.sectionTitle}</h2>
    <span class="work-sub" style="color:${C.muted}">${S.gallery.sectionSub}</span>`;

  // CAROUSEL
  const items   = S.gallery.items;
  const visible = S.gallery.visibleCount || 2.4;
  const track   = document.getElementById("carousel-track");
  const outer   = document.getElementById("track-outer");
  const dotsEl  = document.getElementById("carousel-dots");
  const prevBtn = document.getElementById("arrow-prev");
  const nextBtn = document.getElementById("arrow-next");

  // style arrows
  [prevBtn, nextBtn].forEach(b => {
    b.style.borderColor = C.accent + "99";
    b.style.color = C.cream;
    b.onmouseover = () => { b.style.background = C.accent; b.style.borderColor = C.accent; };
    b.onmouseout  = () => { b.style.background = "transparent"; b.style.borderColor = C.accent + "99"; };
  });

  let current = 0;

  function slideWidth() {
    return (outer.clientWidth / visible);
  }

  function buildSlides() {
    track.innerHTML = "";
    const sw = slideWidth();
    items.forEach((item, i) => {
      const slide = document.createElement("div");
      slide.className = "carousel-slide";
      slide.style.width = sw + "px";
      slide.innerHTML = `
        <div class="slide-img-wrap">
          <img src="${res(item.src)}" alt="${item.label}">
        </div>
        <div class="slide-info">
          <div class="slide-label" style="color:${C.cream}">${item.label}</div>
          ${item.sub ? `<div class="slide-sub" style="color:${C.muted}">${item.sub}</div>` : ""}
        </div>`;
      track.appendChild(slide);
    });
  }

  function buildDots() {
    dotsEl.innerHTML = "";
    const pages = Math.ceil(items.length - Math.floor(visible) + 1);
    for (let i = 0; i < items.length; i++) {
      const dot = document.createElement("button");
      dot.className = "dot" + (i === 0 ? " active" : "");
      dot.style.background = i === 0 ? C.accent : C.muted + "55";
      dot.onclick = () => goTo(i);
      dotsEl.appendChild(dot);
    }
  }

  function updateDots() {
    [...dotsEl.children].forEach((d, i) => {
      const active = i === current;
      d.classList.toggle("active", active);
      d.style.background = active ? C.accent : C.muted + "55";
    });
  }

  function goTo(index) {
    const max = items.length - Math.floor(visible);
    current = Math.max(0, Math.min(index, max));
    track.style.transform = `translateX(-${current * slideWidth()}px)`;
    updateDots();
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current >= max;
  }

  // drag / swipe
  let dragStart = null, dragX = 0;
  outer.addEventListener("mousedown",  e => { dragStart = e.clientX; dragX = 0; track.style.transition = "none"; });
  outer.addEventListener("mousemove",  e => { if (dragStart === null) return; dragX = e.clientX - dragStart; track.style.transform = `translateX(${-current * slideWidth() + dragX}px)`; });
  outer.addEventListener("mouseup",    e => { track.style.transition = ""; if (Math.abs(dragX) > 60) goTo(current + (dragX < 0 ? 1 : -1)); else goTo(current); dragStart = null; });
  outer.addEventListener("mouseleave", e => { if (dragStart !== null) { track.style.transition = ""; goTo(current); dragStart = null; } });
  outer.addEventListener("touchstart", e => { dragStart = e.touches[0].clientX; track.style.transition = "none"; }, {passive:true});
  outer.addEventListener("touchmove",  e => { if (dragStart === null) return; dragX = e.touches[0].clientX - dragStart; track.style.transform = `translateX(${-current * slideWidth() + dragX}px)`; }, {passive:true});
  outer.addEventListener("touchend",   e => { track.style.transition = ""; if (Math.abs(dragX) > 60) goTo(current + (dragX < 0 ? 1 : -1)); else goTo(current); dragStart = null; });

  prevBtn.onclick = () => goTo(current - 1);
  nextBtn.onclick = () => goTo(current + 1);

  buildSlides();
  buildDots();
  goTo(0);
  window.addEventListener("resize", () => { buildSlides(); goTo(current); });

  // PROCESS
  document.getElementById("process").style.background = C.backgroundAlt;
  document.getElementById("process-label").style.color = C.silver;
  document.getElementById("process-label").textContent = S.process.label;
  document.getElementById("process-title").style.color = C.cream;
  document.getElementById("process-title").innerHTML = `${S.process.title1}<br><em style="color:${C.silver}">${S.process.titleEm}</em>`;
  document.getElementById("process-sub").style.color = C.muted;
  document.getElementById("process-sub").textContent = S.process.subtitle;
  document.getElementById("process-steps").innerHTML = S.process.steps.map((st,i) => `
    <div class="step">
      <div class="step-num" style="color:${C.accent}">${String(i+1).padStart(2,"0")}</div>
      <div class="step-title" style="color:${C.cream}">${st.title}</div>
      <div class="step-body" style="color:${C.muted}">${st.body}</div>
    </div>`).join("");

  // CTA
  document.getElementById("commission").style.background = C.backgroundDeep;
  document.getElementById("cta-bg").style.background = `radial-gradient(ellipse at 50% 100%,${C.accent}55 0%,transparent 70%)`;
  document.getElementById("cta-label").style.color = C.silver;
  document.getElementById("cta-label").textContent = S.cta.label;
  document.getElementById("cta-title").style.color = C.cream;
  document.getElementById("cta-title").innerHTML = `${S.cta.title1}<br><em style="color:${C.silver}">${S.cta.titleEm}</em><br>${S.cta.title2}`;
  document.getElementById("cta-body").style.color = C.muted;
  document.getElementById("cta-body").textContent = S.cta.body;
  const cb = document.getElementById("cta-btn");
  cb.href = S.instagramUrl; cb.target = "_blank"; cb.textContent = S.cta.btn;
  cb.style.cssText = `background:${C.accent}33;border:0.5px solid ${C.accent}bb;color:${C.cream}`;
  cb.onmouseover = () => cb.style.background = C.accent;
  cb.onmouseout  = () => cb.style.background = `${C.accent}33`;
  document.getElementById("cta-note").style.color = C.muted;
  document.getElementById("cta-note").textContent = "@" + S.instagramHandle;

  // FOOTER
  document.getElementById("footer").style.background = C.background;
  document.getElementById("footer").innerHTML = `
    <div class="footer-logo" style="color:${C.cream}">${S.brandName} <em style="color:${C.silver}">${S.brandSub}</em></div>
    <div class="footer-links">
      <a href="#work" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Work</a>
      <a href="#process" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Process</a>
      <a href="${S.instagramUrl}" target="_blank" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Instagram</a>
    </div>
    <div class="footer-copy" style="color:${C.muted}66">${S.footer.copy}</div>`;
})();
</script>
</body>
</html>
