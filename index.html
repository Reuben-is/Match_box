<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;font-weight:300;}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:24px 48px;}
.nav-bg{position:absolute;inset:0;pointer-events:none;}
.logo{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;letter-spacing:0.06em;position:relative;z-index:1;}
.logo em{font-style:italic;}
.nav-links{display:flex;gap:32px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;position:relative;z-index:1;}
.nav-links a{text-decoration:none;transition:color 0.2s;}
.nav-cta{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 24px;cursor:pointer;transition:all 0.25s;position:relative;z-index:1;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block;border-radius:8px;}

.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;}
.hero-left{display:flex;flex-direction:column;justify-content:flex-end;padding:120px 64px 80px;position:relative;}
.hero-bg-text{position:absolute;top:50%;left:48px;transform:translateY(-50%);font-family:'DM Serif Display',serif;font-size:180px;font-weight:500;color:rgba(255,255,255,0.03);line-height:1;pointer-events:none;white-space:nowrap;font-style:italic;}
.hero-eyebrow{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.6;margin-bottom:28px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:72px;font-weight:400;line-height:1.0;margin-bottom:32px;}
.hero-title em{font-style:italic;}
.hero-body{font-size:14px;line-height:1.85;max-width:340px;margin-bottom:48px;}
.hero-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.btn-primary{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:14px 36px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;font-weight:400;transition:background 0.2s;text-decoration:none;display:inline-block;border-radius:8px;}
.btn-ghost{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;transition:color 0.2s;text-decoration:none;border-radius:8px;}
.hero-right{position:relative;overflow:hidden;}
.hero-img-mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;}
.mosaic-cell{overflow:hidden;}
.mosaic-cell img{width:100%;height:100%;object-fit:cover;filter:saturate(0.7) contrast(1.1);transition:transform 0.6s ease;}
.mosaic-cell:hover img{transform:scale(1.04);}
.hero-right-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,15,14,0.4) 0%,transparent 60%);pointer-events:none;}

.divider-strip{border-top:0.5px solid rgba(200,205,208,0.1);border-bottom:0.5px solid rgba(200,205,208,0.1);padding:16px 0;overflow:hidden;}
.divider-inner{display:flex;gap:0;white-space:nowrap;animation:marquee 36s linear infinite;width:max-content;}
.divider-item{font-size:10px;letter-spacing:0.24em;text-transform:uppercase;flex-shrink:0;padding:0 28px;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

.about{display:grid;grid-template-columns:1fr 1fr;min-height:80vh;}
.about-img{position:relative;overflow:hidden;}
.about-img #about-img-wrap{position:absolute;inset:0;}
.about-img #about-img-wrap img{width:100%;height:100%;object-fit:cover;filter:saturate(0.65) contrast(1.15);}
.about-img-overlay{position:absolute;inset:0;pointer-events:none;}
.about-content{padding:100px 72px;display:flex;flex-direction:column;justify-content:center;}
.section-label{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.5;margin-bottom:32px;display:flex;align-items:center;gap:16px;}
.section-label::after{content:'';display:block;width:40px;height:0.5px;background:rgba(200,205,208,0.3);}
.about-title{font-family:'DM Serif Display',serif;font-size:44px;font-weight:400;line-height:1.15;margin-bottom:28px;}
.about-title em{font-style:italic;}
.about-body{font-size:14px;line-height:1.9;margin-bottom:40px;}
.about-body p+p{margin-top:16px;}

.work{padding:120px 48px;}
.work-header{text-align:center;margin-bottom:64px;}
.work-title{font-family:'DM Serif Display',serif;font-size:48px;font-weight:400;margin-bottom:12px;}
.work-sub{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;}

.gallery-wrap{position:relative;max-width:1400px;margin:0 auto;user-select:none;}
.gallery-track-outer{overflow:hidden;cursor:pointer;}
.gallery-track{display:flex;transition:transform 0.7s cubic-bezier(0.25,0.1,0.25,1);}
.gallery-slide{flex-shrink:0;width:33.333%;padding:0 8px;box-sizing:border-box;}
.gallery-slide-inner{position:relative;overflow:hidden;border-radius:12px;}
.gallery-slide img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:saturate(0.7) contrast(1.1);display:block;transition:filter 0.4s,transform 0.5s cubic-bezier(0.4,0,0.2,1);border-radius:12px;}
.gallery-slide-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,15,14,0.92) 0%,rgba(13,15,14,0.15) 55%,transparent 100%);opacity:0;transition:opacity 0.4s;pointer-events:none;}
.gallery-slide-info{position:absolute;bottom:0;left:0;right:0;padding:32px 28px;transform:translateY(10px);opacity:0;transition:opacity 0.4s,transform 0.4s;pointer-events:none;}
.gallery-slide-label{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;margin-bottom:5px;}
.gallery-slide-sub{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:14px;}
.gallery-slide-divider{width:28px;height:0.5px;margin-bottom:12px;opacity:0.4;}
.gallery-slide-desc{font-size:13px;line-height:1.8;max-width:280px;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s ease;}
.lightbox.open{opacity:1;pointer-events:auto;}
.lightbox-scrim{position:absolute;inset:0;background:rgba(13,15,14,0.92);backdrop-filter:blur(8px);}
.lightbox-content{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;max-width:1200px;width:92%;transform:translateY(20px);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);background:rgba(13,15,14,0.6);border:0.5px solid rgba(200,205,208,0.1);border-radius:16px;padding:48px;}
.lightbox.open .lightbox-content{transform:translateY(0);}
.lightbox-img-wrap{position:relative;width:500px;flex-shrink:0;border-radius:12px;overflow:hidden;}
.lightbox-img-wrap img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:saturate(0.85) contrast(1.05);display:block;}
.lightbox-text{display:flex;flex-direction:column;gap:16px;}
.lightbox-label{font-family:'DM Serif Display',serif;font-size:36px;font-weight:400;line-height:1.1;}
.lightbox-label em{font-style:italic;}
.lightbox-sub{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;}
.lightbox-rule{width:40px;height:0.5px;opacity:0.3;}
.lightbox-desc{font-size:14px;line-height:1.9;max-width:340px;}
.lightbox-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border:0.5px solid rgba(200,205,208,0.2);background:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:border-color 0.2s;z-index:2;border-radius:8px;}
.lightbox-close:hover{border-color:rgba(200,205,208,0.5);}

.gallery-controls{display:flex;justify-content:center;gap:8px;margin-top:36px;}
.gallery-dot{width:6px;height:6px;border-radius:4px;border:none;cursor:pointer;transition:all 0.3s;}

@media(max-width:768px){
  .work{padding:80px 16px;}
  .gallery-slide{width:85%;}
  .lightbox-content{grid-template-columns:1fr;gap:32px;}
  .lightbox-img-wrap{width:100%;}
}

/* PRICING SECTION */
.pricing{padding:120px 48px;position:relative;}
.pricing-header{text-align:center;max-width:700px;margin:0 auto 80px;}
.pricing-eyebrow{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.5;margin-bottom:24px;}
.pricing-title{font-family:'DM Serif Display',serif;font-size:48px;font-weight:400;line-height:1.15;margin-bottom:16px;}
.pricing-title em{font-style:italic;}
.pricing-subtitle{font-size:14px;line-height:1.8;margin-top:16px;}

.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;max-width:1200px;margin:0 auto 48px;}
.pricing-card{border:0.5px solid rgba(200,205,208,0.15);padding:48px 40px;position:relative;transition:all 0.3s ease;border-radius:16px;}
.pricing-card.featured{border-color:rgba(107,26,26,0.4);transform:scale(1.02);}
.pricing-card.featured::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(107,26,26,0.08) 0%,transparent 60%);pointer-events:none;}

.pricing-name{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin-bottom:8px;}
.pricing-price{font-size:32px;letter-spacing:-0.02em;margin-bottom:32px;}
.pricing-features{list-style:none;margin-bottom:40px;}
.pricing-features li{font-size:13px;line-height:2;padding-left:20px;position:relative;}
.pricing-features li::before{content:'—';position:absolute;left:0;}

.pricing-note{text-align:center;font-size:12px;line-height:1.8;max-width:600px;margin:0 auto;padding-top:32px;border-top:0.5px solid rgba(200,205,208,0.1);}

@media (max-width:900px){
  .pricing-grid{grid-template-columns:1fr;max-width:400px;}
  .pricing-card.featured{transform:none;}
}

.process{padding:120px 48px;position:relative;overflow:hidden;}
.process::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 10% 60%, rgba(107,26,26,0.09) 0%, transparent 65%),
    radial-gradient(ellipse 50% 70% at 90% 15%, rgba(200,205,208,0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 55% 90%, rgba(107,26,26,0.05) 0%, transparent 60%);}
.process::after{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;pointer-events:none;
  background:linear-gradient(to right, transparent, rgba(107,26,26,0.4) 30%, rgba(107,26,26,0.4) 70%, transparent);}
.process-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:80px;max-width:1400px;margin-left:auto;margin-right:auto;gap:60px;position:relative;z-index:1;}
.process-eyebrow{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;margin-bottom:16px;}
.process-title{font-family:'DM Serif Display',serif;font-size:48px;font-weight:400;line-height:1.15;}
.process-subtitle{font-size:14px;line-height:1.9;max-width:320px;margin-top:8px;}

.process-steps{max-width:1400px;margin:0 auto;position:relative;z-index:1;}

.process-timeline-track{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}

.process-step{background:#0d0f0e;border:0.5px solid rgba(200,205,208,0.1);padding:40px 32px;display:flex;flex-direction:column;border-radius:16px;}
.process-step-num{font-family:'DM Serif Display',serif;font-size:72px;font-weight:400;font-style:italic;line-height:1;margin-bottom:24px;opacity:0.12;}
.process-step-text{display:flex;flex-direction:column;gap:10px;}
.process-step-title{font-size:16px;letter-spacing:0.04em;}
.process-step-body{font-size:13px;line-height:1.85;}

@media(max-width:900px){
  .process-timeline-track{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .process-timeline-track{grid-template-columns:1fr;}
}

.commission{padding:140px 48px;text-align:center;position:relative;overflow:hidden;}
.cta-bg{position:absolute;inset:0;pointer-events:none;}
.cta-content{position:relative;z-index:1;max-width:600px;margin:0 auto;}
.cta-label{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;margin-bottom:32px;}
.cta-title{font-family:'DM Serif Display',serif;font-size:64px;font-weight:400;line-height:1.1;margin-bottom:28px;}
.cta-title em{font-style:italic;}
.cta-body{font-size:14px;line-height:1.9;margin-bottom:48px;}
.cta-btn{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:16px 48px;cursor:pointer;border:0.5px solid;font-family:'DM Sans',sans-serif;transition:all 0.25s;text-decoration:none;display:inline-block;border-radius:8px;}
.cta-note{font-size:11px;margin-top:24px;letter-spacing:0.08em;}

footer{padding:64px 48px 48px;display:flex;flex-direction:column;gap:40px;border-top:0.5px solid rgba(200,205,208,0.08);}
.footer-logo{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:0.06em;}
.footer-logo em{font-style:italic;}
.footer-links{display:flex;gap:32px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;}
.footer-links a{text-decoration:none;transition:color 0.2s;}
.footer-copy{font-size:10px;letter-spacing:0.12em;}

@media (max-width:768px){
  nav{padding:20px 24px;}
  .nav-links{display:none;}
  .hero{grid-template-columns:1fr;min-height:auto;}
  .hero-left{padding:100px 32px 60px;}
  .hero-bg-text{font-size:80px;}
  .hero-title{font-size:48px;}
  .hero-right{min-height:50vh;}
  .about{grid-template-columns:1fr;}
  .about-img{min-height:50vh;}
  .about-content{padding:60px 32px;}
  .work{padding:80px 24px;}
  .pricing{padding:80px 24px;}
  .process{padding:80px 24px;}
  .process-header{flex-direction:column;gap:32px;}
  .commission{padding:100px 24px;}
  footer{padding:48px 24px 32px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-bg" id="nav-bg"></div>
  <div class="logo" id="nav-logo"></div>
  <div class="nav-links" id="nav-links"></div>
  <a href="#" class="nav-cta" id="nav-cta"></a>
</nav>

<section class="hero" id="hero">
  <div class="hero-left" id="hero-left">
    <div class="hero-bg-text" id="hero-bg-text"></div>
    <div class="hero-eyebrow" id="hero-eyebrow"></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-body" id="hero-body"></p>
    <div class="hero-actions">
      <a href="#" class="btn-primary" id="hero-cta"></a>
      <a href="#work" class="btn-ghost" id="hero-ghost"></a>
    </div>
  </div>
  <div class="hero-right">
    <div class="hero-img-mosaic" id="hero-mosaic"></div>
    <div class="hero-right-overlay"></div>
  </div>
</section>

<div class="divider-strip" id="divider"></div>

<section class="about" id="about">
  <div class="about-img">
    <div id="about-img-wrap"></div>
    <div class="about-img-overlay" id="about-overlay"></div>
  </div>
  <div class="about-content" id="about-content"></div>
</section>

<section class="work" id="work">
  <div class="work-header" id="work-header"></div>
  <div class="gallery-wrap">
    <div class="gallery-track-outer" id="gallery-track-outer">
      <div class="gallery-track" id="gallery-track"></div>
    </div>
    <div class="gallery-controls" id="gallery-dots"></div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-scrim" id="lightbox-scrim"></div>
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
  <div class="lightbox-content">
    <div class="lightbox-img-wrap"><img id="lightbox-img" src="" alt=""></div>
    <div class="lightbox-text">
      <div class="lightbox-label" id="lightbox-label"></div>
      <div class="lightbox-sub" id="lightbox-sub"></div>
      <div class="lightbox-rule" id="lightbox-rule"></div>
      <div class="lightbox-desc" id="lightbox-desc"></div>
    </div>
  </div>
</div>

<section class="pricing" id="pricing">
  <div class="pricing-header" id="pricing-header"></div>
  <div class="pricing-grid" id="pricing-grid"></div>
  <div class="pricing-note" id="pricing-note"></div>
</section>

<section class="process" id="process">
  <div class="process-header" id="process-header"></div>
  <div class="process-steps" id="process-steps"></div>
</section>

<section class="commission" id="commission">
  <div class="cta-bg" id="cta-bg"></div>
  <div class="cta-content">
    <div class="cta-label" id="cta-label"></div>
    <h2 class="cta-title" id="cta-title"></h2>
    <p class="cta-body" id="cta-body"></p>
    <a href="#" class="cta-btn" id="cta-btn"></a>
    <p class="cta-note" id="cta-note"></p>
  </div>
</section>

<footer id="footer"></footer>

<script>
(function(){
  const S = SETTINGS;
  const C = S.colors;
  function res(k){
    const m = {
      H1:"images/h1.jpg",
      H2:"images/h2.jpg",
      H3:"images/h3.jpg",
      H4:"images/h4.jpg",
      G1:"images/g1.jpg",
      G2:"images/g2.jpg",
      G3:"images/g3.jpg",
      G4:"images/g4.jpg",
      G5:"images/g5.jpg",
      G6:"images/g6.jpg",
      G7:"images/g7.jpg",
      G8:"images/g8.jpg",
      G9:"images/g9.jpg",
      G10:"images/g10.jpg",
      ABOUT:"images/about.jpg",
      P1:"images/p1.png",
      P2:"images/p2.png",
      P3:"images/p3.png",
      P4:"images/p4.png"
    };
    return m[k]||"";
  }

  document.body.style.background = C.background;
  document.body.style.color = C.cream;
  const nb = document.getElementById("nav-bg");
  nb.style.background = `linear-gradient(to bottom,${C.background}ee,transparent)`;

  const nl = document.getElementById("nav-logo");
  nl.innerHTML = `${S.brandName} <em>${S.brandSub}</em>`;
  nl.style.color = C.cream;

  const nlinks = document.getElementById("nav-links");
  nlinks.innerHTML = `
    <a href="#about" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">About</a>
    <a href="#work" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Work</a>
    <a href="#pricing" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Pricing</a>
    <a href="#process" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Process</a>
  `;

  const nc = document.getElementById("nav-cta");
  nc.href = S.instagramUrl; nc.target = "_blank"; nc.textContent = "Reach out";
  nc.style.cssText = `background:${C.accent}33;border:0.5px solid ${C.accent}bb;color:${C.cream};border-radius:2px;`;
  nc.onmouseover = () => nc.style.background = C.accent;
  nc.onmouseout  = () => nc.style.background = `${C.accent}33`;

  const hero = document.getElementById("hero");
  const hl = document.getElementById("hero-left");
  hl.style.background = C.background;
  document.getElementById("hero-bg-text").textContent = S.hero.titleEm;
  document.getElementById("hero-eyebrow").style.color = C.silver;
  document.getElementById("hero-eyebrow").textContent = S.hero.eyebrow;
  document.getElementById("hero-title").style.color = C.cream;
  document.getElementById("hero-title").innerHTML = `${S.hero.title1} ${S.hero.title2}<br><em style="color:${C.silver}">${S.hero.titleEm}</em><br>${S.hero.title3}`;
  document.getElementById("hero-body").style.color = C.muted;
  document.getElementById("hero-body").textContent = S.hero.body;

  const hcta = document.getElementById("hero-cta");
  hcta.href = S.instagramUrl; hcta.target = "_blank"; hcta.textContent = S.hero.ctaBtn;
  hcta.style.cssText = `background:${C.accent};color:${C.cream};border-radius:2px;`;
  hcta.onmouseover = () => hcta.style.background = C.accentHover;
  hcta.onmouseout  = () => hcta.style.background = C.accent;

  const hghost = document.getElementById("hero-ghost");
  hghost.style.color = C.silver; hghost.textContent = S.hero.ghostBtn;
  hghost.onmouseover = () => hghost.style.color = C.cream;
  hghost.onmouseout  = () => hghost.style.color = C.silver;

  const mosaic = document.getElementById("hero-mosaic");
  const mosaicImgs = ["H1","H2","H3","H4"];
  mosaicImgs.forEach(src => {
    const cell = document.createElement("div");
    cell.className = "mosaic-cell";
    cell.innerHTML = `<img src="${res(src)}" alt="Work sample">`;
    mosaic.appendChild(cell);
  });

  const div = document.getElementById("divider");
  div.style.background = C.backgroundAlt;
  const marqueeItems = ["Custom silverwork","·","Handpicked gemstones","·","Commission only","·",S.location,"·","Sterling silver","·","Made to order","·"];
  const marqueeHTML = marqueeItems.concat(marqueeItems).map(t=>`<span class="divider-item">${t}</span>`).join("");
  div.innerHTML = `<div class="divider-inner" style="color:${C.muted}">${marqueeHTML}</div>`;

  const aiw = document.getElementById("about-img-wrap");
  const aimg = document.createElement("img");
  aimg.src = res("ABOUT"); aimg.alt = "Reuben";
  aimg.style.cssText = "width:100%;height:100%;object-fit:cover;filter:saturate(0.65) contrast(1.15);";
  aiw.insertBefore(aimg, aiw.firstChild);
  document.getElementById("about-overlay").style.background = `linear-gradient(to right,transparent 60%,${C.background})`;
  const ac = document.getElementById("about-content");
  ac.style.background = C.background;
  ac.innerHTML = `
    <div class="section-label" style="color:${C.silver}">${S.about.label}</div>
    <h2 class="about-title" style="color:${C.cream}">${S.about.title1}<br><em style="color:${C.silver}">${S.about.titleEm}</em></h2>
    <div class="about-body" style="color:${C.muted}">
      <p>${S.about.para1}</p><p>${S.about.para2}</p><p>${S.about.para3}</p>
    </div>`;

  document.getElementById("work").style.background = C.background;
  document.getElementById("work-header").innerHTML = `
    <h2 class="work-title" style="color:${C.cream}">${S.gallery.sectionTitle}</h2>
    <span class="work-sub" style="color:${C.muted}">${S.gallery.sectionSub}</span>`;

  const track      = document.getElementById("gallery-track");
  const dotsEl     = document.getElementById("gallery-dots");
  const trackOuter = document.getElementById("gallery-track-outer");
  const items      = S.gallery.items;
  const perPage    = 3;
  const maxIdx     = items.length - perPage;

  // Lightbox elements
  const lightbox  = document.getElementById("lightbox");
  const lbImg     = document.getElementById("lightbox-img");
  const lbLabel   = document.getElementById("lightbox-label");
  const lbSub     = document.getElementById("lightbox-sub");
  const lbRule    = document.getElementById("lightbox-rule");
  const lbDesc    = document.getElementById("lightbox-desc");
  lbLabel.style.color = C.cream;
  lbSub.style.color   = C.muted;
  lbRule.style.background = C.accent;
  lbDesc.style.color  = C.silver;
  document.getElementById("lightbox-close").style.color = C.cream;

  function openLightbox(item) {
    lbImg.src       = res(item.src);
    lbImg.alt       = item.label;
    lbLabel.innerHTML = item.label;
    lbSub.textContent = item.sub;
    lbDesc.textContent = item.desc;
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
  }
  document.getElementById("lightbox-close").onclick = closeLightbox;
  document.getElementById("lightbox-scrim").onclick = closeLightbox;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

  // Build slides
  items.forEach((item) => {
    const slide = document.createElement("div");
    slide.className = "gallery-slide";
    slide.innerHTML = `
      <div class="gallery-slide-inner">
        <img src="${res(item.src)}" alt="${item.label}">
        <div class="gallery-slide-overlay"></div>
        <div class="gallery-slide-info">
          <div class="gallery-slide-label" style="color:${C.cream}">${item.label}</div>
          <div class="gallery-slide-sub" style="color:${C.muted}">${item.sub}</div>
        </div>
      </div>`;
    slide.addEventListener("click", () => openLightbox(item));
    track.appendChild(slide);
  });

  // Dots
  const dotCount = window.innerWidth <= 768 ? items.length : maxIdx + 1;
  for (let i = 0; i < dotCount; i++) {
    const dot = document.createElement("button");
    dot.className = "gallery-dot";
    dot.style.background = i === 0 ? C.accent : C.muted + "55";
    dot.onclick = () => goTo(i);
    dotsEl.appendChild(dot);
  }

  function goTo(idx) {
    const perPageNow = window.innerWidth <= 768 ? 1 : perPage;
    const mIdx = items.length - perPageNow;
    const clamped = Math.max(0, Math.min(idx, mIdx));
    smoothCurrent = clamped;
    const slideW = trackOuter.clientWidth / perPageNow;
    track.style.transform = `translateX(-${clamped * slideW}px)`;
    [...dotsEl.children].forEach((d, i) => {
      const active = i === clamped;
      d.style.background = active ? C.accent : C.muted + "55";
      d.style.width = active ? "20px" : "6px";
    });
  }

  // Touch swipe support
  let touchStartX = 0;
  let touchStartY = 0;
  let touchDeltaX = 0;
  let isSwiping = false;

  trackOuter.addEventListener("touchstart", e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    isSwiping = false;
    track.style.transition = "none";
  }, { passive: true });

  trackOuter.addEventListener("touchmove", e => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (!isSwiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
      isSwiping = true;
    }
    if (isSwiping) {
      touchDeltaX = dx;
      const perPageNow = window.innerWidth <= 768 ? 1 : perPage;
      const slideW = trackOuter.clientWidth / perPageNow;
      track.style.transform = `translateX(${-smoothCurrent * slideW + touchDeltaX}px)`;
    }
  }, { passive: true });

  trackOuter.addEventListener("touchend", () => {
    track.style.transition = "";
    if (isSwiping && Math.abs(touchDeltaX) > 50) {
      const perPageNow = window.innerWidth <= 768 ? 1 : perPage;
      const mIdx = items.length - perPageNow;
      if (touchDeltaX < 0) goTo(Math.min(Math.round(smoothCurrent) + 1, mIdx));
      else goTo(Math.max(Math.round(smoothCurrent) - 1, 0));
    } else {
      goTo(Math.round(smoothCurrent));
    }
    isSwiping = false;
  });

  // Hover navigation (desktop only)
  let hoverTarget = 0;
  let smoothCurrent = 0;
  let rafId = null;

  trackOuter.addEventListener("mousemove", e => {
    const rect = trackOuter.getBoundingClientRect();
    hoverTarget = (e.clientX - rect.left) / rect.width * maxIdx;
    if (!rafId) rafId = requestAnimationFrame(animateScroll);
  });
  trackOuter.addEventListener("mouseleave", () => {
    cancelAnimationFrame(rafId);
    rafId = null;
  });

  function animateScroll() {
    smoothCurrent += (hoverTarget - smoothCurrent) * 0.06;
    const perPageNow = window.innerWidth <= 768 ? 1 : perPage;
    const slideW = trackOuter.clientWidth / perPageNow;
    track.style.transform = `translateX(-${smoothCurrent * slideW}px)`;
    [...dotsEl.children].forEach((d, i) => {
      const active = i === Math.round(smoothCurrent);
      d.style.background = active ? C.accent : C.muted + "55";
      d.style.width = active ? "20px" : "6px";
    });
    rafId = requestAnimationFrame(animateScroll);
  }

  window.addEventListener("resize", () => goTo(0));
  goTo(0);
  // PRICING SECTION
  document.getElementById("pricing").style.background = C.background;
  document.getElementById("pricing").style.borderTop = `1px solid rgba(200,205,208,0.06)`;
  document.getElementById("pricing").style.borderBottom = `1px solid rgba(200,205,208,0.06)`;
  document.getElementById("pricing-header").innerHTML = `
    <div class="pricing-eyebrow" style="color:${C.silver}">${S.pricing.label}</div>
    <h2 class="pricing-title" style="color:${C.cream}">${S.pricing.title1} <em style="color:${C.silver}">${S.pricing.titleEm}</em></h2>
    <p class="pricing-subtitle" style="color:${C.muted}">${S.pricing.subtitle}</p>
  `;

  document.getElementById("pricing-grid").innerHTML = S.pricing.tiers.map(tier => `
    <div class="pricing-card${tier.featured ? ' featured' : ''}">
      <div class="pricing-name" style="color:${C.cream}">${tier.name}</div>
      <div class="pricing-price" style="color:${C.silver}">${tier.price}</div>
      <ul class="pricing-features" style="color:${C.muted}">
        ${tier.features.map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>
  `).join('');

  document.getElementById("pricing-note").style.color = C.muted;
  document.getElementById("pricing-note").textContent = S.pricing.note;

  document.getElementById("process").style.background = C.backgroundAlt;
  document.getElementById("process-header").innerHTML = `
    <div>
      <p class="process-eyebrow" style="color:${C.silver}">${S.process.label}</p>
      <h2 class="process-title" style="color:${C.cream}">${S.process.title}</h2>
    </div>
    <p class="process-subtitle" style="color:${C.muted}">${S.process.subtitle}</p>`;
  document.getElementById("process-steps").innerHTML = `
    <div class="process-timeline-track">
      ${S.process.steps.map(st => `
        <div class="process-step" style="border-color:rgba(200,205,208,0.08);">
          <div class="process-step-num" style="color:${C.cream}">${st.num}</div>
          <div class="process-step-text">
            <div class="process-step-title" style="color:${C.cream}">${st.title}</div>
            <div class="process-step-body" style="color:${C.muted}">${st.body}</div>
          </div>
        </div>`).join("")}
    </div>`;

  document.getElementById("commission").style.background = C.backgroundDeep;
  document.getElementById("cta-bg").style.background = `radial-gradient(ellipse at 50% 100%,${C.accent}55 0%,transparent 70%)`;
  document.getElementById("cta-label").style.color = C.silver;
  document.getElementById("cta-label").textContent = S.cta.label;
  document.getElementById("cta-title").style.color = C.cream;
  document.getElementById("cta-title").innerHTML = `${S.cta.title1}<br><em style="color:${C.silver}">${S.cta.titleEm}</em><br>${S.cta.title2}`;
  document.getElementById("cta-body").style.color = C.muted;
  document.getElementById("cta-body").textContent = S.cta.body;
  const cb = document.getElementById("cta-btn");
  cb.href = S.instagramUrl; cb.target = "_blank"; cb.textContent = S.cta.btn;
  cb.style.cssText = `background:${C.accent}33;border:0.5px solid ${C.accent}bb;color:${C.cream}`;
  cb.onmouseover = () => cb.style.background = C.accent;
  cb.onmouseout  = () => cb.style.background = `${C.accent}33`;
  document.getElementById("cta-note").style.color = C.muted;
  document.getElementById("cta-note").textContent = "@" + S.instagramHandle;

  document.getElementById("footer").style.background = C.background;
  document.getElementById("footer").innerHTML = `
    <div class="footer-logo" style="color:${C.cream}">${S.brandName} <em style="color:${C.silver}">${S.brandSub}</em></div>
    <div class="footer-links">
      <a href="#work" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Work</a>
      <a href="#pricing" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Pricing</a>
      <a href="#process" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Process</a>
      <a href="${S.instagramUrl}" target="_blank" style="color:${C.muted}" onmouseover="this.style.color='${C.cream}'" onmouseout="this.style.color='${C.muted}'">Instagram</a>
    </div>
    <div class="footer-copy" style="color:${C.muted}66">${S.footer.copy}</div>`;
})();
</script>
</body>
</html>
